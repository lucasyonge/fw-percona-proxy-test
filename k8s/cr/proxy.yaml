apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-cm
data:
  proxy.conf: |
    server-ip valkey-benchmark-cluster.default.svc.cluster.local
    server-port 6379
    bind 0.0.0.0
    port 7777
    cluster_refresh_interval_ms 2000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-proxy
  labels:
    valkey-component: valkey-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      valkey-component: valkey-proxy
  template:
    metadata:
      labels:
        app: valkey-proxy
        valkey-component: valkey-proxy
    spec:
      volumes:
        - name: config
          configMap:
            name: proxy-cm
      imagePullSecrets:
        - name: dell-demo
      containers:
        - name: proxy
          image: valkey-proxy:latest
          imagePullPolicy: IfNotPresent
          command: ["valkey-proxy"]
          args:
            - /opt/proxy.conf
          ports:
            - name: tcp
              containerPort: 7777
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt
          resources:
            requests:
              cpu: "0.5"
              memory: "1024Mi"
            limits:
              cpu: "1"
              memory: "2048Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-proxy
spec:
  type: ClusterIP
  selector:
    valkey-component: valkey-proxy
  ports:
    - protocol: TCP
      port: 7777
      targetPort: 7777
